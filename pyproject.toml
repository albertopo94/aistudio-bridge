[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aistudio-bridge"
version = "0.9.3"
description = "Local orchestrator for Google's Antigravity managed agent with local-first memory and verified code return"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
remote-worker = "remote_worker.cli:main"

[tool.setuptools]
packages = ["remote_worker"]
